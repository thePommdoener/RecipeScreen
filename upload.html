<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rezept senden</title>

<style>
    * { box-sizing: border-box; }

    body {
        font-family: Arial, sans-serif;
        background: white;
        color: black;
        margin: 0;
        padding: 20px 16px;
    }

    .wrap { max-width: 500px; margin: 0 auto; }

    h1 { font-size: 1.6rem; }

    label { display: block; font-size: 1.1rem; margin: 18px 0 8px; }
    .sub { font-size: 0.9rem; color: #666; font-weight: normal; }

    input, textarea, button {
        width: 100%;
        font-size: 1.1rem;
        font-family: inherit;
        padding: 14px;
        border: 2px solid black;
        border-radius: 10px;
    }

    textarea { min-height: 160px; resize: vertical; }

    button {
        margin-top: 18px;
        background: black;
        color: white;
        font-weight: bold;
    }

    button:disabled { opacity: 0.5; }

    #msg { margin-top: 15px; font-size: 1.1rem; }
    .ok { color: #1a7f37; }
    .err { color: #c00; }
</style>
</head>

<body>
<div class="wrap">
    <h1>Rezept an die Küche senden</h1>

    <form id="form">
        <label for="link">Link zum Rezept</label>
        <input id="link" type="url" required placeholder="https://www.chefkoch.de/…" autocomplete="off">

        <label for="text">
            Rezepttext <span class="sub">(optional – z. B. die Beschreibung aus Instagram hier einfügen)</span>
        </label>
        <textarea id="text" placeholder="Zutaten, Schritte …"></textarea>

        <button id="send" type="submit">Senden</button>
    </form>

    <div id="msg"></div>
</div>

<script>
const topic = new URLSearchParams(location.search).get('k');
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const btn = document.getElementById('send');

// ntfy.sh nimmt Nachrichten bis 4096 Bytes als Text an – größere würden zu Dateianhängen.
const MAX_BYTES = 3900;

if (!topic) {
    form.style.display = 'none';
    msg.className = 'err';
    msg.textContent = 'Kein Bildschirm verknüpft. Bitte den QR-Code am Küchenbildschirm scannen.';
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = document.getElementById('link').value.trim();
    const text = document.getElementById('text').value.trim();
    const body = JSON.stringify({ url, text });

    if (new TextEncoder().encode(body).length > MAX_BYTES) {
        msg.className = 'err';
        msg.textContent = 'Der Text ist zu lang. Bitte auf Zutaten und Schritte kürzen.';
        return;
    }

    btn.disabled = true;
    msg.className = '';
    msg.textContent = 'Sende …';

    try {
        const res = await fetch('https://ntfy.sh/' + encodeURIComponent(topic), {
            method: 'POST',
            body
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        msg.className = 'ok';
        msg.textContent = '✓ Gesendet! Der Bildschirm bereitet das Rezept jetzt auf.';
        form.reset();
    } catch (err) {
        msg.className = 'err';
        msg.textContent = 'Fehler beim Senden: ' + err.message;
    } finally {
        btn.disabled = false;
    }
});
</script>
</body>
</html>
